# Handless E4 — opción sin recursos de pago.
# Puede desplegarse directamente como Render Web Service (Free), sin Blueprint.
# DATABASE_URL: conectar a PostgreSQL Free de Neon (no guardar credenciales aquí).
# El servicio Free de Render tiene sistema de archivos efímero: NO usar SQLite.
services:
  - type: web
    name: handless-e4
    runtime: docker
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false
      - key: PUBLIC_DEMO_ENABLED
        value: 'true'
