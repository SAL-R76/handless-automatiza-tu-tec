name: Handless E4 · verificación
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Valor exclusivo para tests locales: NO es secreto ni contraseña de Render.
      DEMO_PASSWORD: CI-FICTICIA-PRUEBA-LOCAL-SIN-ACCESO-PUBLICO
      PUBLIC_DEMO_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m py_compile scripts/test_live_e4.py
      - run: PYTHONPATH=. python -m pytest tests -q
      - run: PYTHONPATH=. python scripts/benchmark.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
